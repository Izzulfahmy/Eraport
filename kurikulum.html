<style>
    .kurikulum-container { display: flex; flex-direction: column; gap: 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .btn-primary {
        padding: 10px 20px;
        background-color: #ffd23f;
        color: black;
        border: 3px solid #000000;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 3px 3px 0px #000000;
    }
    .btn-primary:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #000000; }
    
    .btn-secondary {
        padding: 10px 20px;
        background-color: #ffffff;
        color: black;
        border: 3px solid #000000;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 2px 2px 0px #000000;
    }

    .table-responsive { width: 100%; overflow-x: auto; background: white; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .table-kurikulum { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .table-kurikulum th, .table-kurikulum td { padding: 12px 15px; border: 2px solid #000000; }
    .table-kurikulum th { background-color: #ffd23f; color: black; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .table-kurikulum tr:hover { background-color: #fffdf5; }
    
    /* Toggle Switch Kotak kaku */
    .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff4d4d; border: 2px solid #000; transition: .1s; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border: 2px solid #000; transition: .1s; }
    input:checked + .slider { background-color: #28a745; }
    input:checked + .slider:before { transform: translateX(24px); }

    .form-card { background: white; padding: 25px; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .form-field input, .form-field select { padding: 10px; border: 2px solid #000000; font-size: 14px; }
    .form-field input:focus, .form-field select:focus { background-color: #7fdde0; outline: none; }
    
    .btn-group-actions { display: flex; gap: 5px; }
    .btn-edit { background-color: #ffd23f; border: 2px solid #000; font-weight: bold; cursor: pointer; padding: 6px 12px; }
    .btn-delete { background-color: #ff4d4d; border: 2px solid #000; color: white; font-weight: bold; cursor: pointer; padding: 6px 12px; }

    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
</style>

<div class="kurikulum-container">
    <div id="viewTabelKurikulum">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 style="font-family: 'Space Grotesk'; font-size: 20px;">Manajemen Kurikulum</h3>
            <button class="btn-primary" onclick="bukaFormKurikulum()">+ Tambah Kurikulum</button>
        </div>
        
        <div class="table-responsive">
            <table class="table-kurikulum">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>ID</th>
                        <th>Nama Kurikulum</th>
                        <th>Jumlah Jenjang</th>
                        <th>Relasi Tahun Pelajaran</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyKurikulum"></tbody>
            </table>
        </div>
    </div>

    <div id="viewFormKurikulum" style="display: none;">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 id="formKurikulumTitle" style="font-family: 'Space Grotesk'; font-size: 20px;">Tambah Kurikulum Baru</h3>
            <button class="btn-secondary" onclick="kembaliKeTabelKurikulum()">Kembali</button>
        </div>

        <div class="form-card">
            <form id="formKurikulum" onsubmit="simpanDataKurikulum(event)">
                <input type="hidden" id="kurikulum_id_hidden">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Nama Kurikulum</label>
                        <input type="text" id="nama_kurikulum" placeholder="Contoh: Kurikulum Merdeka" required>
                    </div>
                    <div class="form-field">
                        <label>Jumlah Jenjang / Tingkatan</label>
                        <input type="number" id="jumlah_jenjang" min="1" max="20" required>
                    </div>
                    <div class="form-field">
                        <label>Tahun Pelajaran (Relasi)</label>
                        <select id="relasi_tahun_pelajaran" required>
                            <option value="">-- Pilih Tahun Pelajaran --</option>
                        </select>
                    </div>
                    <div class="form-field" style="justify-content: center;">
                        <label style="margin-bottom: 8px;">Status Aktif</label>
                        <div>
                            <label class="switch">
                                <input type="checkbox" id="kurikulum_aktif_checkbox">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="kembaliKeTabelKurikulum()">Batal</button>
                    <button type="submit" class="btn-primary" id="btnSimpanKurikulum">Simpan Kurikulum</button>
                </div>
            </form>
        </div>
    </div>
</div>
