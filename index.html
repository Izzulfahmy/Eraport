<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eraport</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
        }
        /* Container Form (Login & Register) */
        .auth-page {
            display: none;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .auth-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        /* Halaman Dashboard */
        #dashboard-page {
            display: none;
            height: 100vh;
        }
        .navbar {
            background-color: #ffffff;
            height: 60px;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .profile-logo {
            width: 40px;
            height: 40px;
            background-color: #6c757d;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .dropdown-menu button {
            background: none;
            border: none;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f8f9fa;
        }
        .show {
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="register-page" class="auth-page">
        <div class="auth-container">
            <h2>Register Administrator</h2>
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" onkeydown="handleRegisterKeyPress(event)">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" onkeydown="handleRegisterKeyPress(event)">
            </div>
            <button class="btn-submit" onclick="handleRegister()">Buat Akun Admin</button>
        </div>
    </div>

    <div id="login-page" class="auth-page">
        <div class="auth-container">
            <h2>Login</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" onkeydown="handleLoginKeyPress(event)">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" onkeydown="handleLoginKeyPress(event)">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Login</button>
        </div>
    </div>

    <div id="dashboard-page">
        <nav class="navbar">
            <div class="profile-logo" onclick="toggleDropdown()">
                A
            </div>
            <div class="dropdown-menu" id="profileDropdown">
                <button onclick="handleLogout()">Logout</button>
            </div>
        </nav>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, limit, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCBXA1Atpm8LpDSdAr02OEvuADP2bUT9Gk",
            authDomain: "eraport-87687.firebaseapp.com",
            projectId: "eraport-87687",
            storageBucket: "eraport-87687.firebasestorage.app",
            messagingSenderId: "879847959076",
            appId: "1:879847959076:web:51ca5db07bb4724b7e06b1",
            measurementId: "G-NWCTMGHZEV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Fungsi Utama untuk Memeriksa Keberadaan Admin Saat Website Dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            // Cek Status Login Session terlebih dahulu
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            
            if (isLoggedIn === 'true') {
                showDashboard();
                return;
            }

            try {
                // Memeriksa apakah sudah ada data dokumen di dalam collection 'users'
                const usersRef = collection(db, "users");
                const q = query(usersRef, limit(1));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // Jika sudah ada minimal satu user/admin terdaftar, tampilkan halaman login
                    showLogin();
                } else {
                    // Jika database benar-benar kosong, tampilkan halaman register admin
                    showRegister();
                }
            } catch (error) {
                console.error("Gagal memeriksa database Firestore: ", error);
                alert("Terjadi kesalahan koneksi ke database.");
                showLogin(); // Fallback keamanan ke halaman login
            }
        });

        // Handler Event Tombol Enter pada Halaman Register
        window.handleRegisterKeyPress = function(event) {
            if (event.key === 'Enter') {
                handleRegister();
            }
        }

        // Handler Event Tombol Enter pada Halaman Login
        window.handleLoginKeyPress = function(event) {
            if (event.key === 'Enter') {
                handleLogin();
            }
        }

        // Proses Register Akun Admin Pertama Kali
        window.handleRegister = async function() {
            const userInp = document.getElementById('reg-username').value.trim();
            const passInp = document.getElementById('reg-password').value;

            if (userInp === "" || passInp.trim() === "") {
                alert("Username dan Password untuk Administrator tidak boleh kosong");
                return;
            }

            try {
                // Menggunakan username inputan custom sebagai Document ID di Firestore
                const adminDocRef = doc(db, "users", userInp);
                await setDoc(adminDocRef, {
                    username: userInp,
                    password: passInp,
                    role: "administrator",
                    createdAt: serverTimestamp()
                });

                alert("Akun Administrator berhasil dibuat! Silakan login.");
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-password').value = '';
                showLogin();
            } catch (error) {
                console.error("Gagal membuat akun administrator di Firestore: ", error);
                alert("Gagal menyimpan data ke database.");
            }
        }

        // Proses Login User / Admin
        window.handleLogin = async function() {
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value;

            if (userInp === "" || passInp === "") {
                alert("Username dan Password tidak boleh kosong");
                return;
            }

            try {
                const userDocRef = doc(db, "users", userInp);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists() && userDocSnap.data().password === passInp) {
                    // Perbarui timestamp login terakhir
                    await updateDoc(userDocRef, {
                        lastLogin: serverTimestamp()
                    });

                    localStorage.setItem('isLoggedIn', 'true');
                    showDashboard();
                } else {
                    alert('Username atau Password salah');
                }
            } catch (error) {
                console.error("Gagal melakukan autentikasi Firestore: ", error);
                alert("Terjadi kesalahan koneksi database.");
            }
        }

        // Handler Logout
        window.handleLogout = function() {
            localStorage.removeItem('isLoggedIn');
            document.getElementById('profileDropdown').classList.remove('show');
            showLogin();
        }

        // Toggle Dropdown Menu
        window.toggleDropdown = function() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        // Fungsi Navigasi Tampilan Layar
        function showRegister() {
            document.getElementById('register-page').style.display = 'flex';
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'none';
        }

        function showLogin() {
            document.getElementById('register-page').style.display = 'none';
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('dashboard-page').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('register-page').style.display = 'none';
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'block';
            // Bersihkan input teks login
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Menutup dropdown jika klik di luar area profil
        window.onclick = function(event) {
            if (!event.target.matches('.profile-logo')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
