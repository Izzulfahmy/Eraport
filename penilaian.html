<style>
    .pn-container { display: flex; flex-direction: column; gap: 10px; }
    .filter-bar { background: white; padding: 12px 15px; border: 3px solid #000; box-shadow: 4px 4px 0px #000; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .filter-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .filter-field label { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .filter-field select { padding: 6px 8px; border: 2px solid #000; font-size: 12px; }

    .pn-split-layout { display: grid; grid-template-columns: 390px 1fr; gap: 15px; align-items: start; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .action-bar h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px !important; color: #000; font-weight: 700; text-transform: uppercase; }
    
    .btn-icon { width: 34px; height: 34px; border: 2px solid #000; border-radius: 0px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; font-weight: bold; }
    .btn-success { background-color: #7fdde0; color: black; }
    .btn-secondary { background-color: #ffffff; color: black; }
    .btn-primary { background-color: #ffd23f; color: black; }
    .btn-del-small { background: #ff4d4d; color: black; border: 2px solid #000; padding: 1px 5px; cursor: pointer; font-weight: bold; }

    /* PERBAIKAN: Tombol Aksi Tabel Rombel memakai style Kotak Kuning Neubrutalism Kaku bertumpuk */
    .btn-table-action-neubrutalism {
        width: 36px;
        height: 36px;
        background-color: #ffd23f;
        color: #000000;
        border: 3px solid #000000;
        border-radius: 0px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        box-shadow: 3px 3px 0px #000000;
        transition: all 0.05s ease;
    }
    .btn-table-action-neubrutalism:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #000000;
    }

    /* Tab Menu Ringkas Horizontal */
    .tab-container { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 3px solid #000; width: 100%; flex-wrap: wrap; }
    .tab-item { padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; background: #ffffff; border: 2px solid #000; border-bottom: none; text-transform: uppercase; }
    .tab-item.active { background: #ff6b6b; color: black; }

    .table-responsive { width: 100%; overflow-x: auto; background: white; border: 3px solid #000; }
    .table-pn { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    .table-pn th, .table-pn td { padding: 10px; border: 2px solid #000; vertical-align: middle; }
    .table-pn th { background-color: #ffd23f; color: black; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    
    .clickable-row-kelas { cursor: pointer; }
    .clickable-row-kelas:hover { background-color: #fffdf5 !important; }
    .clickable-row-kelas.selected-active-kelas { background-color: #7fdde0 !important; font-weight: bold; }

    .form-box-mode { background-color: #ffffff; padding: 15px; border: 3px solid #000; box-shadow: 4px 4px 0px #000; }
    .compact-input-group { display: flex; gap: 8px; align-items: center; margin-top: 8px; background: #fffdf5; padding: 8px; border: 2px dashed #000; }
    .compact-input-group label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; min-width: 90px; }
    .compact-input-group input, .compact-input-group select { padding: 6px; border: 2px solid #000; font-size: 12px; }

    .tree-box { background: #ffffff; padding: 8px; border: 2px solid #000; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
    .topik-group { background: #fffdf5; border: 2px solid #000; padding: 8px; margin-bottom: 4px; box-shadow: 2px 2px 0px #000; }
    .topik-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .tp-sub-list { display: flex; flex-direction: column; gap: 4px; padding-left: 10px; margin-top: 6px; }
    .tp-item-row { background: white; padding: 4px 8px; border: 1px solid #000; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

    .editable-text-field { cursor: text; padding: 2px; }
    .editable-text-field:hover { background: #7fdde0; }
    
    .grid-wrapper-box { 
        background: white; 
        border: 3px solid #000000; 
        padding: 6px; 
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
    }
    
    #jspreadsheet_container_nilai {
        width: 100%;
    }

    @media (max-width: 1024px) { .pn-split-layout { grid-template-columns: 1fr; } }
</style>

<div class="pn-container">
    <div class="filter-bar">
        <div class="filter-field">
            <label>Tahun Pelajaran:</label>
            <select id="filter_tp_penilaian"></select>
        </div>
        <div class="filter-field">
            <label>Kurikulum:</label>
            <select id="filter_kurikulum_penilaian"></select>
        </div>
    </div>

    <div id="viewFormInputNilai" style="display: none;" class="form-box-mode">
        <div class="action-bar" style="margin-bottom: 10px;">
            <h3 id="titleFormInputNilaiHeader">📝 INPUT NILAI MURID</h3>
            <div style="display:flex; gap:5px;">
                <button type="button" class="btn-icon btn-secondary" onclick="kembaliKeTabelRombelPenilaian()">←</button>
                <button type="button" class="btn-icon btn-success" onclick="simpanKumpulanNilaiJSpreadsheetCE()">✓</button>
            </div>
        </div>
        <div id="nilai_tab_mapel" class="tab-container"></div>
        <div class="grid-wrapper-box">
            <div id="jspreadsheet_container_nilai"></div>
        </div>
    </div>

    <div class="pn-split-layout" id="wrapperLayoutSplitPenilaian">
        <div id="viewTabelRombelPenilaian" class="form-box-mode">
            <div class="action-bar"><h3>🏫 DAFTAR KELAS PENGISIAN</h3></div>
            <div class="table-responsive">
                <table class="table-pn">
                    <thead>
                        <tr>
                            <th style="width: 40px;">No</th>
                            <th>Rombel</th>
                            <th>Wali Kelas</th>
                            <th style="width: 65px; text-align: center;">Nilai</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyRombelPenilaian">
                        <tr><td colspan="4" style="text-align:center;">Silakan pilih filter data di atas.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="form-box-mode" id="viewFormTP">
            <div class="action-bar"><h3 id="titleHeaderStrukturTPKanan">🎯 STRUKTUR TOPIK & TUJUAN PEMBELAJARAN (TP)</h3></div>
            <div id="tp_tab_mapel" class="tab-container"></div>
            
            <!-- PERBAIKAN: Menambahkan simbol + di dalam button agar tidak kosong -->
            <div class="compact-input-group">
                <label>1. Buat Topik:</label>
                <input type="text" id="input_nama_topik" placeholder="Pilih kelas di kiri..." style="flex: 1;" disabled>
                <button type="button" id="btnSimpanTopikInduk" class="btn-icon btn-primary" onclick="simpanTopikBaru()" disabled>+</button>
            </div>

            <!-- PERBAIKAN: Menambahkan simbol + di dalam button agar tidak kosong -->
            <div class="compact-input-group">
                <label>2. Tambah TP:</label>
                <select id="select_wadah_topik" style="width: 150px;" disabled><option value="">-- Pilih Topik --</option></select>
                <input type="text" id="input_teks_tp" placeholder="Pilih kelas di kiri..." style="flex: 1;" disabled>
                <button type="button" id="btnSimpanSubTPTeks" class="btn-icon btn-success" onclick="simpanTPTeksKeTopik()" disabled>+</button>
            </div>

            <div class="tree-box" id="containerPohonStruktur">
                <p style="text-align: center; font-size: 12px; padding: 20px;">Silakan klik salah satu baris kelas di sebelah balik untuk memuat pemetaan kompetensi.</p>
            </div>
        </div>
    </div>
</div>
