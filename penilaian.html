<style>
    .pn-container { display: flex; flex-direction: column; gap: 8px; }
    .filter-bar { background: white; padding: 6px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .filter-field { display: flex; align-items: center; gap: 8px; }
    .filter-field label { font-size: 11px; font-weight: 600; color: #475569; }
    .filter-field select { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
    
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .action-bar h3 { font-size: 14px; color: #333; }
    .btn-icon { width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-del-small { background: #dc3545; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .tab-container { display: flex; gap: 2px; margin-bottom: 5px; border-bottom: 1px solid #cbd5e1; }
    .tab-item { padding: 4px 10px; font-size: 11px; cursor: pointer; background: #e2e8f0; border-radius: 4px 4px 0 0; color: #4a5568; }
    .tab-item.active { background: #007bff; color: white; font-weight: bold; }

    .table-pn { width: 100%; border-collapse: collapse; font-size: 12px; }
    .table-pn th, .table-pn td { padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
    .table-pn th { background: #f8f9fa; font-weight: bold; }

    .form-box-mode { background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; }
    .tree-box { background: #f8f9fa; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; gap: 5px; }
    .topik-group { background: #edf2f7; border-left: 3px solid #007bff; padding: 6px; }
    .topik-header { display: flex; justify-content: space-between; font-weight: bold; color: #2b6cb0; font-size: 12px; }
    .tp-item-row { background: white; padding: 3px 8px; border-radius: 3px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 11px; margin-top: 3px; }

    .grid-wrapper-box { margin-top: 8px; }
    .jexcel > thead > tr > td { padding: 4px !important; font-size: 11px !important; }
    .jexcel > tbody > tr > td { padding: 2px 4px !important; font-size: 12px !important; }
    .jexcel > tbody > tr > td.readonly { color: #000000 !important; font-weight: 500; background-color: #f8fafc !important; }
    .jexcel_nested_headers td { font-size: 11px !important; padding: 4px !important; }
</style>

<div class="pn-container">
    <div class="filter-bar">
        <div class="filter-field">
            <label>TP:</label>
            <select id="filter_tp_penilaian" onchange="handleFilterTpChangePenilaian()"></select>
        </div>
        <div class="filter-field">
            <label>Kurikulum:</label>
            <select id="filter_kurikulum_penilaian" onchange="loadDaftarRombelPenilaian()"></select>
        </div>
    </div>

    <div id="viewTabelRombelPenilaian">
        <div class="action-bar"><h3>Daftar Kelas</h3></div>
        <div class="table-responsive">
            <table class="table-pn">
                <thead><tr><th>No</th><th>Nama Rombel</th><th>Jenjang</th><th>Wali Kelas</th><th>Aksi</th></tr></thead>
                <tbody id="tbodyRombelPenilaian"></tbody>
            </table>
        </div>
    </div>

    <div id="viewFormTP" style="display: none;">
        <div class="action-bar">
            <h3 style="font-size:14px;">Struktur Topik & TP</h3>
            <button class="btn-icon btn-secondary" onclick="kembaliKeTabelRombelPenilaian()">⬅️</button>
        </div>
        <div class="form-box-mode">
            <div id="tp_tab_mapel" class="tab-container"></div>
            <div id="containerPohonStruktur" class="tree-box"></div>
        </div>
    </div>

    <div id="viewFormInputNilai" style="display: none;">
        <div class="action-bar">
            <h3>Input Nilai Murid</h3>
            <div style="display:flex; gap:5px;">
                <button class="btn-icon btn-secondary" onclick="kembaliKeTabelRombelPenilaian()">⬅️</button>
                <button class="btn-icon btn-success" onclick="simpanKumpulanNilaiJSpreadsheetCE()">💾</button>
            </div>
        </div>
        <div class="form-box-mode">
            <div id="nilai_tab_mapel" class="tab-container"></div>
            <div class="grid-wrapper-box"><div id="jspreadsheet_container_nilai"></div></div>
        </div>
    </div>
</div>
