<style>
    .guru-container { display: flex; flex-direction: column; gap: 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .btn-primary {
        padding: 10px 20px;
        background-color: #ffd23f;
        color: black;
        border: 3px solid #000000;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 3px 3px 0px #000000;
    }
    .btn-primary:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #000000; }
    
    .btn-secondary {
        padding: 10px 20px;
        background-color: #ffffff;
        color: black;
        border: 3px solid #000000;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 2px 2px 0px #000000;
    }

    .table-responsive { width: 100%; overflow-x: auto; background: white; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .table-guru { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .table-guru th, .table-guru td { padding: 12px 15px; border: 2px solid #000000; }
    .table-guru th { background-color: #ff6b6b; color: black; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .table-guru tr:hover { background-color: #fffdf5; }
    
    .form-card { background: white; padding: 25px; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .section-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        color: black;
        border-bottom: 3px solid #000000;
        padding-bottom: 6px;
        margin: 25px 0 15px 0;
        font-weight: 700;
        text-transform: uppercase;
    }
    .section-title:first-child { margin-top: 0; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .form-field input, .form-field select { padding: 10px; border: 2px solid #000000; font-size: 14px; }
    .form-field input:focus, .form-field select:focus { background-color: #7fdde0; outline: none; }
    
    .btn-group-actions { display: flex; gap: 5px; }
    .btn-edit { background-color: #ffd23f; border: 2px solid #000; font-weight: bold; cursor: pointer; padding: 6px 12px; }
    .btn-delete { background-color: #ff4d4d; border: 2px solid #000; color: white; font-weight: bold; cursor: pointer; padding: 6px 12px; }

    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
</style>

<div class="guru-container">
    <div id="viewTabelGuru">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 style="font-family: 'Space Grotesk'; font-size: 20px;">Manajemen Data Guru</h3>
            <button class="btn-primary" onclick="bukaFormGuru()">+ Tambah Guru Baru</button>
        </div>
        
        <div class="table-responsive">
            <table class="table-guru">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NUPT / NIP</th>
                        <th>Nama Lengkap</th>
                        <th>Jabatan / Tugas</th>
                        <th>Status Keaktifan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyGuru"></tbody>
            </table>
        </div>
    </div>

    <div id="viewFormGuru" style="display: none;">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 id="formGuruTitle" style="font-family: 'Space Grotesk'; font-size: 20px;">Tambah Data Guru Baru</h3>
            <button class="btn-secondary" onclick="kembaliKeTabelGuru()">Kembali</button>
        </div>

        <div class="form-card">
            <form id="formGuru" onsubmit="simpanDataGuru(event)">
                <input type="hidden" id="guru_id_hidden">

                <div class="section-title">1. Identitas Pribadi Utama</div>
                <div class="form-grid">
                    <div class="form-field"><label>Nama Lengkap (Tanpa Gelar)</label><input type="text" id="nama_lengkap" required></div>
                    <div class="form-field"><label>Gelar Depan</label><input type="text" id="gelar_depan" placeholder="Contoh: Drs."></div>
                    <div class="form-field"><label>Gelar Belakang</label><input type="text" id="gelar_belakang" placeholder="Contoh: S.Pd"></div>
                    <div class="form-field"><label>NIK (Nomor Induk Kependudukan)</label><input type="text" id="nik" required></div>
                    <div class="form-field"><label>Jenis Kelamin</label><select id="jenis_kelamin"><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></div>
                    <div class="form-field"><label>Tempat Lahir</label><input type="text" id="tempat_lahir"></div>
                    <div class="form-field"><label>Tanggal Lahir</label><input type="date" id="tanggal_lahir"></div>
                    <div class="form-field"><label>Agama</label><select id="agama"><option value="Islam">Islam</option><option value="Kristen">Kristen</option><option value="Katolik">Katolik</option><option value="Hindu">Hindu</option><option value="Buddha">Buddha</option><option value="Khonghucu">Khonghucu</option></select></div>
                    <div class="form-field"><label>Golongan Darah</label><select id="gol_darah"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="AB">AB</option><option value="O">O</option></select></div>
                    <div class="form-field"><label>Status Pernikahan</label><select id="status_pernikahan"><option value="Belum Kawin">Belum Kawin</option><option value="Kawin">Kawin</option><option value="Cerai Hidup">Cerai Hidup</option><option value="Cerai Mati">Cerai Mati</option></select></div>
                </div>

                <div class="section-title">2. Identitas Kepegawaian dan Legalitas</div>
                <div class="form-grid">
                    <div class="form-field"><label>NUPTK</label><input type="text" id="nuptk"></div>
                    <div class="form-field"><label>NIP (Khusus PNS)</label><input type="text" id="nip"></div>
                    <div class="form-field"><label>NIY / NIGK</label><input type="text" id="niy_nigk"></div>
                    <div class="form-field"><label>Status Kepegawaian</label><select id="status_kepegawaian"><option value="PNS">PNS</option><option value="PPPK">PPPK</option><option value="GTT">GTT</option><option value="Guru Tetap Yayasan">Guru Tetap Yayasan</option></select></div>
                    <div class="form-field"><label>Jabatan / Tugas Utama</label><select id="jabatan"><option value="Guru Kelas">Guru Kelas</option><option value="Guru Mata Pelajaran">Guru Mata Pelajaran</option><option value="Kepala Sekolah">Kepala Sekolah</option></select></div>
                    <div class="form-field"><label>Pangkat / Golongan</label><input type="text" id="pangkat_golongan" placeholder="Contoh: Penata / IIIc"></div>
                    <div class="form-field"><label>TMT Pengangkatan</label><input type="date" id="tmt_pengangkatan"></div>
                    <div class="form-field"><label>SK Pengangkatan</label><input type="text" id="sk_pengangkatan"></div>
                    <div class="form-field"><label>Lembaga Pengangkat</label><input type="text" id="lembaga_pengangkat"></div>
                    <div class="form-field"><label>NPWP</label><input type="text" id="npwp"></div>
                </div>

                <div class="section-title">3. Riwayat Pendidikan Terakhir</div>
                <div class="form-grid">
                    <div class="form-field"><label>Tingkat Pendidikan</label><select id="tingkat_pendidikan"><option value="D3">D3</option><option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option></select></div>
                    <div class="form-field"><label>Gelar Akademik</label><input type="text" id="gelar_akademik"></div>
                    <div class="form-field"><label>Bidang Studi / Jurusan</label><input type="text" id="jurusan"></div>
                    <div class="form-field"><label>Universitas</label><input type="text" id="universitas"></div>
                    <div class="form-field"><label>Tahun Kelulusan</label><input type="text" id="tahun_kelulusan"></div>
                </div>

                <div class="section-title">4. Kontak dan Domisili</div>
                <div class="form-grid">
                    <div class="form-field"><label>Alamat Rumah</label><input type="text" id="alamat_rumah"></div>
                    <div class="form-field"><label>Kode Pos</label><input type="text" id="kode_pos_guru"></div>
                    <div class="form-field"><label>Nomor HP / WhatsApp</label><input type="text" id="no_hp" required></div>
                    <div class="form-field"><label>Email Pribadi</label><input type="email" id="email_pribadi"></div>
                    <div class="form-field"><label>Email Institusi</label><input type="text" id="email_institusi"></div>
                </div>

                <div class="section-title">5. Data Tambahan Aplikasi (Sistem)</div>
                <div class="form-grid">
                    <div class="form-field"><label>URL Foto Profil</label><input type="text" id="foto_profil"></div>
                    <div class="form-field"><label>Status Keaktifan</label><select id="status_keaktifan"><option value="Aktif">Aktif</option><option value="Cuti">Cuti</option><option value="Mutasi">Mutasi</option><option value="Pensiun">Pensiun</option></select></div>
                    <div class="form-field"><label>Mata Pelajaran Diampu</label><input type="text" id="mapel_diampu"></div>
                    <div class="form-field"><label>Username Sistem</label><input type="text" id="username_sistem" required></div>
                    <div class="form-field"><label>Password Akun</label><input type="password" id="password_sistem" required></div>
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="kembaliKeTabelGuru()">Batal</button>
                    <button type="submit" class="btn-primary" id="btnSimpanGuru">Simpan Data Guru</button>
                </div>
            </form>
        </div>
    </div>
</div>
