<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar - Administrator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
        }
        /* Navbar */
        .navbar {
            background-color: #ffffff;
            height: 60px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .btn-menu {
            padding: 8px 16px;
            background-color: #e2e8f0;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-menu:hover {
            background-color: #cbd5e1;
        }
        .nav-right {
            display: flex;
            align-items: center;
        }
        .profile-logo {
            width: 40px;
            height: 40px;
            background-color: #6c757d;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .dropdown-menu button {
            background: none;
            border: none;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f8f9fa;
        }
        .show {
            display: block !important;
        }

        /* Konten Utama */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-action {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-action:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-menu">Kembali ke Dashboard</a>
        </div>
        <div class="nav-right">
            <div class="profile-logo" onclick="toggleDropdown()">
                A
            </div>
            <div class="dropdown-menu" id="profileDropdown">
                <button onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="card">
            <h3>Konfigurasi Google Drive</h3>
            <div class="form-group">
                <label for="gdrive-link">Link Folder GDrive</label>
                <input type="text" id="gdrive-link" placeholder="Masukkan URL atau ID folder Google Drive">
            </div>
            <button class="btn-action" onclick="saveGDriveLink()">Simpan Konfigurasi</button>
        </div>

        <div class="card">
            <h3>Upload Gambar</h3>
            <div class="form-group">
                <label for="file-input">Pilih File / Gambar</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <button class="btn-action" onclick="handleUpload()">Upload</button>
        </div>

    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCBXA1Atpm8LpDSdAr02OEvuADP2bUT9Gk",
            authDomain: "eraport-87687.firebaseapp.com",
            projectId: "eraport-87687",
            storageBucket: "eraport-87687.firebasestorage.app",
            messagingSenderId: "879847959076",
            appId: "1:879847959076:web:51ca5db07bb4724b7e06b1",
            measurementId: "G-NWCTMGHZEV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Proteksi Halaman: Cek status login session saat dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                // Jika belum login, tendang kembali ke index.html
                window.location.href = "index.html";
                return;
            }
            
            // Muat link GDrive yang tersimpan sebelumnya di Firestore jika ada
            await loadGDriveLink();
        });

        // Fungsi Memuat Link GDrive dari Firestore
        async function loadGDriveLink() {
            try {
                const configDocRef = doc(db, "settings", "gdrive_config");
                const configSnap = await getDoc(configDocRef);
                
                if (configSnap.exists()) {
                    document.getElementById('gdrive-link').value = configSnap.data().folderLink || '';
                }
            } catch (error) {
                console.error("Gagal memuat konfigurasi GDrive: ", error);
            }
        }

        // Fungsi Menyimpan Link Folder GDrive ke Firestore
        window.saveGDriveLink = async function() {
            const linkInp = document.getElementById('gdrive-link').value.trim();

            if (linkInp === "") {
                alert("Kolom link tidak boleh kosong");
                return;
            }

            try {
                // Menyimpan konfigurasi link folder ke collection 'settings' document 'gdrive_config'
                await setDoc(doc(db, "settings", "gdrive_config"), {
                    folderLink: linkInp,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                alert("Link folder Google Drive berhasil disimpan!");
            } catch (error) {
                console.error("Gagal menyimpan konfigurasi GDrive: ", error);
                alert("Gagal menyimpan ke database.");
            }
        }

        // Fungsi Proses Penanganan Upload File Gambar
        window.handleUpload = function() {
            const fileInput = document.getElementById('file-input');
            
            if (fileInput.files.length === 0) {
                alert("Silakan pilih file gambar terlebih dahulu.");
                return;
            }

            const file = fileInput.files[0];
            alert(`File "${file.name}" siap diproses untuk di-upload ke folder Google Drive yang telah dikonfigurasi.`);
            
            // Catatan: Proses upload langsung ke Google Drive API memerlukan penanganan token OAuth2/Service Account
            // Form ini dipersiapkan untuk integrasi endpoint tersebut sesuai perintah dasar Anda.
        }

        // Handler Logout
        window.handleLogout = function() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = "index.html";
        }

        // Toggle Dropdown Menu Profil
        window.toggleDropdown = function() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        // Menutup dropdown jika klik di luar area profil
        window.onclick = function(event) {
            if (!event.target.matches('.profile-logo')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
