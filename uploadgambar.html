<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar - Administrator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
        }
        /* Navbar */
        .navbar {
            background-color: #ffffff;
            height: 60px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .btn-menu {
            padding: 8px 16px;
            background-color: #e2e8f0;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-menu:hover {
            background-color: #cbd5e1;
        }
        .nav-right {
            display: flex;
            align-items: center;
        }
        .profile-logo {
            width: 40px;
            height: 40px;
            background-color: #6c757d;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .dropdown-menu button {
            background: none;
            border: none;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f8f9fa;
        }
        .show {
            display: block !important;
        }

        /* Konten Utama */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-action {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-action:hover {
            background-color: #0056b3;
        }
        .btn-action:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-menu">Kembali ke Dashboard</a>
        </div>
        <div class="nav-right">
            <div class="profile-logo" onclick="toggleDropdown()">
                A
            </div>
            <div class="dropdown-menu" id="profileDropdown">
                <button onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h3>Upload Gambar ke Supabase Storage</h3>
            <div class="form-group">
                <label for="file-input">Pilih File Gambar</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <button class="btn-action" id="uploadBtn" onclick="handleUpload()">Mulai Upload</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://geasyybkirgydfcevpsr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYXN5eWJraXJneWRmY2V2cHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjY2MTUsImV4cCI6MjA5Njg0MjYxNX0.KULKYjkcyp9yLpoTMHG4bjKmNV2HBn1COHj3FLZMbK4";

        const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = "index.html";
            }
        });

        window.handleUpload = async function() {
            const fileInput = document.getElementById('file-input');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (fileInput.files.length === 0) {
                alert("Silakan pilih file gambar terlebih dahulu.");
                return;
            }

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${fileExt}`;
            const currentUser = localStorage.getItem('username') || 'Unknown';

            try {
                uploadBtn.disabled = true;
                uploadBtn.innerText = "Mengupload...";

                // 1. Upload ke Supabase Storage
                const { data: storageData, error: storageError } = await clientSupabase
                    .storage
                    .from('images')
                    .upload(fileName, file);

                if (storageError) throw storageError;

                // 2. Ambil URL Publik gambar
                const { data: urlData } = clientSupabase
                    .storage
                    .from('images')
                    .getPublicUrl(fileName);

                const publicUrl = urlData.publicUrl;

                // 3. Simpan data record ke database Supabase
                const { error: dbError } = await clientSupabase
                    .from('uploaded_images')
                    .insert([
                        { 
                            image_url: publicUrl, 
                            file_name: file.name, 
                            uploaded_by: currentUser 
                        }
                    ]);

                if (dbError) throw dbError;

                alert("Gambar berhasil diupload ke Supabase!");
                fileInput.value = '';
                
            } catch (error) {
                console.error("Proses upload gagal:", error);
                alert("Gagal mengupload gambar. Pastikan Bucket 'images' di Supabase Storage sudah dibuat dan di-set ke Public.");
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Mulai Upload";
            }
        }

        window.handleLogout = function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = "index.html";
        }

        window.toggleDropdown = function() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.profile-logo')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
