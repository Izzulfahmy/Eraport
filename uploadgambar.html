<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar - Administrator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
        }
        /* Navbar */
        .navbar {
            background-color: #ffffff;
            height: 60px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .btn-menu {
            padding: 8px 16px;
            background-color: #e2e8f0;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-menu:hover {
            background-color: #cbd5e1;
        }
        .nav-right {
            display: flex;
            align-items: center;
        }
        .profile-logo {
            width: 40px;
            height: 40px;
            background-color: #6c757d;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .dropdown-menu button {
            background: none;
            border: none;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f8f9fa;
        }
        .show {
            display: block !important;
        }

        /* Konten Utama */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-action {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-action:hover {
            background-color: #0056b3;
        }
        .btn-action:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-menu">Kembali ke Dashboard</a>
        </div>
        <div class="nav-right">
            <div class="profile-logo" onclick="toggleDropdown()">
                A
            </div>
            <div class="dropdown-menu" id="profileDropdown">
                <button onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h3>Upload Gambar ke Google Drive</h3>
            <div class="form-group">
                <label for="file-input">Pilih File Gambar</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <button class="btn-action" id="uploadBtn" onclick="handleUpload()">Mulai Upload</button>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCBXA1Atpm8LpDSdAr02OEvuADP2bUT9Gk",
            authDomain: "eraport-87687.firebaseapp.com",
            projectId: "eraport-87687",
            storageBucket: "eraport-87687.firebasestorage.app",
            messagingSenderId: "879847959076",
            appId: "1:879847959076:web:51ca5db07bb4724b7e06b1",
            measurementId: "G-NWCTMGHZEV"
        };

        // URL Google Apps Script Executable Anda
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxONM0d9Bo05nOmAPvSCLzpficqQb-PQyk1mr12VUfkX9ZUYe8UojOJ_80WBkj-SoIB/exec";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Proteksi Halaman
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = "index.html";
            }
        });

        // Fungsi Unggah Gambar Ke Google Drive via Apps Script & Simpan Metadata ke Firestore
        window.handleUpload = async function() {
            const fileInput = document.getElementById('file-input');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (fileInput.files.length === 0) {
                alert("Silakan pilih file gambar terlebih dahulu.");
                return;
            }

            const file = fileInput.files[0];
            const currentUser = localStorage.getItem('username') || 'Unknown';

            try {
                uploadBtn.disabled = true;
                uploadBtn.innerText = "Mengupload ke Google Drive...";

                // 1. Membaca berkas file dan mengubahnya menjadi format teks Base64
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(file);
                });

                // 2. Mengirim data JSON ke Google Apps Script Web App
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        base64: base64Data,
                        fileName: file.name
                    })
                });

                const result = await response.json();

                if (result.status !== "success") {
                    throw new Error(result.message || "Gagal memproses di Google Apps Script.");
                }

                // 3. Simpan link direct URL Google Drive yang dikembalikan ke Cloud Firestore
                await addDoc(collection(db, "uploaded_images"), {
                    imageUrl: result.imageUrl,
                    fileName: file.name,
                    uploadedBy: currentUser,
                    createdAt: serverTimestamp()
                });

                alert("Gambar berhasil diupload dan disimpan ke Google Drive!");
                fileInput.value = ''; // Reset input berkas
                
            } catch (error) {
                console.error("Proses upload gagal:", error);
                alert("Gagal mengupload gambar ke Google Drive. Pastikan konfigurasi Deployment Apps Script disetel ke 'Anyone'.");
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Mulai Upload";
            }
        }

        // Handler Logout
        window.handleLogout = function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = "index.html";
        }

        // Toggle Dropdown Menu Profil
        window.toggleDropdown = function() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        // Menutup dropdown jika klik di luar area profil
        window.onclick = function(event) {
            if (!event.target.matches('.profile-logo')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
