<style>
    .mp-container { display: flex; flex-direction: column; gap: 20px; }
    .filter-bar { background: #ffffff; padding: 15px 20px; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; display: flex; gap: 20px; flex-wrap: wrap; }
    .filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 200px; flex: 1; }
    .filter-field label { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .filter-field select { padding: 8px 10px; border: 2px solid #000000; font-size: 14px; background-color: #fff; }
    
    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-group-top { display: flex; gap: 10px; }
    
    .btn-primary { padding: 10px 16px; background-color: #ffd23f; color: black; border: 2px solid #000; font-family: 'Space Grotesk', sans-serif; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0px #000; }
    .btn-success { padding: 10px 16px; background-color: #7fdde0; color: black; border: 2px solid #000; font-family: 'Space Grotesk', sans-serif; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0px #000; }
    .btn-secondary { padding: 10px 20px; background-color: #ffffff; color: black; border: 2px solid #000; font-family: 'Space Grotesk', sans-serif; font-weight: 700; cursor: pointer; }

    .table-responsive { width: 100%; overflow-x: auto; background: white; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .table-mp { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .table-mp th, .table-mp td { padding: 12px 15px; border: 2px solid #000000; vertical-align: middle; }
    .table-mp th { background-color: #ff6b6b; color: black; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    
    .tr-grup { background-color: #fffdf5; font-weight: bold; }
    .tr-grup td { color: #000000; border-bottom: 3px solid #000000; }
    .td-sub-mapel { padding-left: 40px !important; }

    /* SINKRONISASI KELAS AKSI DUA BUTTON MATA PELAJARAN */
    .btn-actions-mapel { display: flex; gap: 5px; }
    .btn-edit-mp { background-color: #ffd23f; color: #000; border: 2px solid #000; padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.1s; }
    .btn-edit-mp:hover { background-color: #7fdde0; }
    .btn-delete-mp { background-color: #ff4d4d; color: #000; border: 2px solid #000; padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.1s; }
    .btn-delete-mp:hover { background-color: #ffd23f; }

    .form-card { background: white; padding: 25px; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .form-field input, .form-field select { padding: 10px; border: 2px solid #000000; }
    .form-field input:focus, .form-field select:focus { background-color: #7fdde0; outline: none; }

    @media (max-width: 768px) {
        .filter-bar { flex-direction: column; gap: 10px; }
        .action-bar { flex-direction: column; align-items: stretch; gap: 15px; }
        .btn-group-top { flex-direction: column; }
        .form-grid { grid-template-columns: 1fr; }
    }
</style>

<div class="mp-container">
    <div class="filter-bar">
        <div class="filter-field">
            <label>Tahun Pelajaran</label>
            <select id="filter_tp_mapel" onchange="handleFilterTpChange()"></select>
        </div>
        <div class="filter-field">
            <label>Kurikulum Terrelasi</label>
            <select id="filter_kurikulum_mapel" onchange="loadDaftarMapel()">
                <option value="">-- Pilih Kurikulum --</option>
            </select>
        </div>
    </div>

    <div id="viewTabelMP">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 style="font-family: 'Space Grotesk'; font-size: 18px;">Daftar Struktur Muatan Mata Pelajaran</h3>
            <div class="btn-group-top">
                <button class="btn-primary" onclick="bukaFormGrup()">+ Buat Grup Baru</button>
                <button class="btn-success" id="btnTambahMapelTop" onclick="bukaFormMapel()" disabled>+ Tambah Mata Pelajaran</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table-mp">
                <thead>
                    <tr>
                        <th>Kode Pendek</th>
                        <th>Nama Kelompok / Mata Pelajaran</th>
                        <th>Tipe</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyMP">
                    <tr><td colspan="4" style="text-align:center; color:#000;">Silakan pilih Tahun Pelajaran dan Kurikulum terlebih dahulu.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="viewFormGrup" style="display: none;">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 id="formGrupTitle" style="font-family: 'Space Grotesk'; font-size: 18px;">Buat Kelompok / Grup Mapel Baru</h3>
            <button class="btn-secondary" onclick="kembaliKeTabelMP()">Kembali</button>
        </div>
        <div class="form-card">
            <form id="formGrupMP" onsubmit="simpanGrupMP(event)">
                <input type="hidden" id="grup_id_hidden">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Nama Grup / Kelompok Mata Pelajaran</label>
                        <input type="text" id="grup_nama" placeholder="Contoh: Kelompok A" required>
                    </div>
                    <div class="form-field">
                        <label>Kode Urut Kelompok (Opsional)</label>
                        <input type="text" id="grup_kode" placeholder="Contoh: KEL_A">
                    </div>
                </div>
                <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="kembaliKeTabelMP()">Batal</button>
                    <button type="submit" class="btn-primary" id="btnSaveGrup">Simpan Grup</button>
                </div>
            </form>
        </div>
    </div>

    <div id="viewFormMapel" style="display: none;">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 id="formMapelTitle" style="font-family: 'Space Grotesk'; font-size: 18px;">Tambah Mata Pelajaran Baru</h3>
            <button class="btn-secondary" onclick="kembaliKeTabelMP()">Kembali</button>
        </div>
        <div class="form-card">
            <form id="formMapel" onsubmit="simpanDataMapel(event)">
                <input type="hidden" id="mapel_id_hidden">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Pilih Grup / Kelompok Wadah</label>
                        <select id="mapel_parent_id" required>
                            <option value="">-- Pilih Kelompok --</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Nama Mata Pelajaran</label>
                        <input type="text" id="mapel_nama" required>
                    </div>
                    <div class="form-field">
                        <label>Kode Pendek Mata Pelajaran</label>
                        <input type="text" id="mapel_kode_pendek" required>
                    </div>
                </div>
                <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="kembaliKeTabelMP()">Batal</button>
                    <button type="submit" class="btn-success" id="btnSaveMapel">Simpan Mata Pelajaran</button>
                </div>
            </form>
        </div>
    </div>
</div>
