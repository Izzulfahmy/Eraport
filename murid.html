<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    .murid-container { display: flex; flex-direction: column; gap: 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .btn-group-right { display: flex; gap: 10px; align-items: center; }
    
    /* Tombol Utama Neubrutalism */
    .btn-primary { 
        padding: 10px 20px; 
        background-color: #ffd23f; 
        color: black; 
        border: 3px solid #000000; 
        font-family: 'Space Grotesk', sans-serif; 
        font-weight: 700; 
        cursor: pointer; 
        box-shadow: 3px 3px 0px #000000; 
        font-size: 14px;
    }
    .btn-primary:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #000000; }
    
    .btn-secondary { 
        padding: 10px 20px; 
        background-color: #ffffff; 
        color: black; 
        border: 3px solid #000000; 
        font-family: 'Space Grotesk', sans-serif; 
        font-weight: 700; 
        cursor: pointer; 
        box-shadow: 2px 2px 0px #000000; 
    }

    /* Tombol Ikon Khusus Excel (Upload & Download Template) */
    .btn-excel-action {
        width: 44px;
        height: 44px;
        border: 3px solid #000000;
        border-radius: 0px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 3px 3px 0px #000000;
        transition: all 0.1s;
        padding: 0;
    }
    .btn-excel-upload { background-color: #7fdde0; color: #000000; }
    .btn-excel-download { background-color: #ff6b6b; color: #000000; }
    .btn-excel-action:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000000; }
    .btn-excel-action:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000000; }
    .btn-excel-action svg { display: block; }

    .table-responsive { width: 100%; overflow-x: auto; background: white; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .table-murid { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .table-murid th, .table-murid td { padding: 12px 15px; border: 2px solid #000000; vertical-align: middle; }
    .table-murid th { background-color: #7fdde0; color: black; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .table-murid tr:hover { background-color: #fffdf5; }
    
    .form-card { background: white; padding: 25px; border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: black; border-bottom: 3px solid #000000; padding-bottom: 6px; margin: 25px 0 15px 0; font-weight: 700; text-transform: uppercase; }
    .section-title:first-child { margin-top: 0; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .form-field input, .form-field select { padding: 10px; border: 2px solid #000000; font-size: 14px; }
    .form-field input:focus, .form-field select:focus { background-color: #7fdde0; outline: none; }
    
    .btn-group-actions { display: flex; gap: 5px; }
    .btn-edit { background-color: #ffd23f; border: 2px solid #000; font-weight: bold; cursor: pointer; padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; }
    .btn-delete { background-color: #ff4d4d; border: 2px solid #000; color: white; font-weight: bold; cursor: pointer; padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; }

    @media (max-width: 768px) { 
        .form-grid { grid-template-columns: 1fr; } 
        .action-bar { flex-direction: column; align-items: stretch; }
        .btn-group-right { width: 100%; justify-content: flex-start; }
    }
</style>

<div class="murid-container">
    <div id="viewTabelMurid">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 style="font-family: 'Space Grotesk'; font-size: 20px; color: #000000;">Manajemen Data Murid</h3>
            <div class="btn-group-right">
                <input type="file" id="excel_file_input" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelImport(event)">
                
                <button class="btn-excel-action btn-excel-upload" onclick="document.getElementById('excel_file_input').click()" title="Import Excel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
                
                <button class="btn-excel-action btn-excel-download" onclick="unduhTemplateExcelMurid()" title="Download Template Excel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                </button>
                
                <button class="btn-primary" onclick="bukaFormMurid()">+ Tambah Murid Baru</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table-murid">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NIS (ID) / NISN</th>
                        <th>Nama Lengkap Murid</th>
                        <th>Kelas / Absen</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyMurid"></tbody>
            </table>
        </div>
    </div>

    <div id="viewFormMurid" style="display: none;">
        <div class="action-bar" style="margin-bottom: 15px;">
            <h3 id="formMuridTitle" style="font-family: 'Space Grotesk'; font-size: 20px;">Tambah Data Murid Baru</h3>
            <button class="btn-secondary" onclick="kembaliKeTabelMurid()">Kembali</button>
        </div>

        <div class="form-card">
            <form id="formMurid" onsubmit="simpanDataMurid(event)">
                <input type="hidden" id="murid_id_hidden">

                <div class="section-title">1. Identitas Pribadi Utama</div>
                <div class="form-grid">
                    <div class="form-field"><label>Nama Lengkap Murid</label><input type="text" id="nama_lengkap" required></div>
                    <div class="form-field"><label>Nama Panggilan</label><input type="text" id="nama_panggilan"></div>
                    <div class="form-field"><label>NIS Lokal (ID)</label><input type="text" id="nis" required></div>
                    <div class="form-field"><label>NISN</label><input type="text" id="nisn" required></div>
                    <div class="form-field"><label>NIK / KIA</label><input type="text" id="nik" required></div>
                    <div class="form-field"><label>No. Akta Kelahiran</label><input type="text" id="no_akta"></div>
                    <div class="form-field"><label>Jenis Kelamin</label><select id="jenis_kelamin"><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></div>
                    <div class="form-field"><label>Tempat Lahir</label><input type="text" id="tempat_lahir"></div>
                    <div class="form-field"><label>Tanggal Lahir</label><input type="date" id="tanggal_lahir"></div>
                    <div class="form-field"><label>Agama</label><select id="agama"><option value="Islam">Islam</option><option value="Kristen">Kristen</option><option value="Katolik">Katolik</option><option value="Hindu">Hindu</option><option value="Buddha">Buddha</option><option value="Khonghucu">Khonghucu</option></select></div>
                    <div class="form-field"><label>Kewarganegaraan</label><input type="text" id="kewarganegaraan" value="WNI"></div>
                    <div class="form-field"><label>Anak Ke-</label><input type="number" id="anak_ke" min="1"></div>
                    <div class="form-field"><label>Jumlah Saudara</label><input type="number" id="jumlah_saudara" min="0"></div>
                    <div class="form-field"><label>Golongan Darah</label><select id="gol_darah"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="AB">AB</option><option value="O">O</option></select></div>
                </div>

                <div class="section-title">2. Kontak dan Domisili Murid</div>
                <div class="form-grid">
                    <div class="form-field"><label>Alamat Tempat Tinggal</label><input type="text" id="alamat_tinggal" required></div>
                    <div class="form-field"><label>Kode Pos</label><input type="text" id="kode_pos"></div>
                    <div class="form-field"><label>Tempat Tinggal Bersama</label><select id="tempat_tinggal_bersama"><option value="Orang Tua">Orang Tua</option><option value="Wali">Wali</option><option value="Kos">Kos</option><option value="Asrama">Asrama</option></select></div>
                    <div class="form-field"><label>Moda Transportasi</label><select id="transportasi"><option value="Jalan kaki">Jalan kaki</option><option value="Motor">Motor</option><option value="Angkutan Umum">Angkutan Umum</option><option value="Jemputan">Jemputan</option></select></div>
                    <div class="form-field"><label>Nomor HP Siswa</label><input type="text" id="no_hp_siswa"></div>
                    <div class="form-field"><label>Alamat Email</label><input type="text" id="email_siswa"></div>
                </div>

                <div class="section-title">3. Data Orang Tua (Ayah & Ibu Kandung)</div>
                <div class="form-grid">
                    <div class="form-field"><label>Nama Lengkap Ayah</label><input type="text" id="nama_ayah" required></div>
                    <div class="form-field"><label>NIK Ayah</label><input type="text" id="nik_ayah"></div>
                    <div class="form-field"><label>Tahun Lahir Ayah</label><input type="text" id="tahun_lahir_ayah"></div>
                    <div class="form-field"><label>Pendidikan Ayah</label><input type="text" id="pendidikan_ayah"></div>
                    <div class="form-field"><label>Pekerjaan Ayah</label><input type="text" id="pekerjaan_ayah"></div>
                    <div class="form-field"><label>Penghasilan Ayah</label><select id="penghasilan_ayah"><option value="Tidak Berpenghasilan">Tidak Berpenghasilan</option><option value="< Rp 1.000.000">&lt; Rp 1.000.000</option><option value="Rp 1.000.000 - Rp 3.000.000">Rp 1.000.000 - Rp 3.000.000</option><option value="Rp 3.000.000 - Rp 5.000.000">Rp 3.000.000 - Rp 5.000.000</option><option value="> Rp 5.000.000">&gt; Rp 5.000.000</option></select></div>
                    <div class="form-field"><label>Nama Lengkap Ibu</label><input type="text" id="nama_ibu" required></div>
                    <div class="form-field"><label>NIK Ibu</label><input type="text" id="nik_ibu"></div>
                    <div class="form-field"><label>Tahun Lahir Ibu</label><input type="text" id="tahun_lahir_ibu"></div>
                    <div class="form-field"><label>Pendidikan Ibu</label><input type="text" id="pendidikan_ibu"></div>
                    <div class="form-field"><label>Pekerjaan Ibu</label><input type="text" id="pekerjaan_ibu"></div>
                    <div class="form-field"><label>Penghasilan Ibu</label><select id="penghasilan_ibu"><option value="Tidak Berpenghasilan">Tidak Berpenghasilan</option><option value="< Rp 1.000.000">&lt; Rp 1.000.000</option><option value="Rp 1.000.000 - Rp 3.000.000">Rp 1.000.000 - Rp 3.000.000</option><option value="Rp 3.000.000 - Rp 5.000.000">Rp 3.000.000 - Rp 5.000.000</option><option value="> Rp 5.000.000">&gt; Rp 5.000.000</option></select></div>
                    <div class="form-field"><label>Nomor HP Orang Tua</label><input type="text" id="no_hp_ortu" required></div>
                </div>

                <div class="section-title">4. Data Wali (Opsional)</div>
                <div class="form-grid">
                    <div class="form-field"><label>Nama Lengkap Wali</label><input type="text" id="nama_wali"></div>
                    <div class="form-field"><label>NIK Wali</label><input type="text" id="nik_wali"></div>
                    <div class="form-field"><label>Hubungan Keluarga</label><input type="text" id="hubungan_wali"></div>
                    <div class="form-field"><label>Pekerjaan Wali</label><input type="text" id="pekerjaan_wali"></div>
                    <div class="form-field"><label>Nomor HP Wali</label><input type="text" id="no_hp_wali"></div>
                </div>

                <div class="section-title">5. Riwayat Academic & Pendaftaran</div>
                <div class="form-grid">
                    <div class="form-field"><label>Status Murid</label><select id="status_murid"><option value="Siswa Baru">Siswa Baru</option><option value="Pindahan">Pindahan</option></select></div>
                    <div class="form-field"><label>Asal Sekolah Sebelumnya</label><input type="text" id="asal_sekolah"></div>
                    <div class="form-field"><label>Nomor Ijazah</label><input type="text" id="no_ijazah"></div>
                    <div class="form-field"><label>Nomor SKHUN</label><input type="text" id="no_skhun"></div>
                    <div class="form-field"><label>Tanggal Masuk</label><input type="date" id="tanggal_masuk"></div>
                </div>

                <div class="section-title">6. Data Tambahan Aplikasi (Sistem)</div>
                <div class="form-grid">
                    <div class="form-field"><label>URL Foto Profil Murid</label><input type="text" id="foto_profil"></div>
                    <div class="form-field"><label>ID Kelas / Rombel</label><input type="text" id="id_kelas" required></div>
                    <div class="form-field"><label>Nomor Absen</label><input type="number" id="nomor_absen" min="1" required></div>
                    <div class="form-field"><label>Status Keaktifan</label><select id="status_keaktifan"><option value="Aktif">Aktif</option><option value="Lulus">Lulus</option><option value="Pindahan">Pindahan</option><option value="Drop Out">Drop Out</option></select></div>
                    <div class="form-field"><label>Username Murid</label><input type="text" id="username_murid" required></div>
                    <div class="form-field"><label>Password Murid</label><input type="password" id="password_murid" required></div>
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="kembaliKeTabelMurid()">Batal</button>
                    <button type="submit" class="btn-primary" id="btnSimpanMurid">Simpan Data Murid</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // PERBAIKAN UTAMA: Menggunakan pustaka SheetJS (XLSX) agar mengunduh file format .xlsx murni dan aman di browser
    function unduhTemplateExcelMurid() {
        const headers = [
            "nama_lengkap", "nama_panggilan", "nis", "nisn", "nik", "no_akta", "jenis_kelamin", 
            "tempat_lahir", "tanggal_lahir", "agama", "kewarganegaraan", "anak_ke", "jumlah_saudara", "gol_darah",
            "alamat_tinggal", "kode_pos", "tempat_tinggal_bersama", "transportasi", "no_hp_siswa", "email_siswa",
            "nama_ayah", "nik_ayah", "tahun_lahir_ayah", "pendidikan_ayah", "pekerjaan_ayah", "penghasilan_ayah",
            "nama_ibu", "nik_ibu", "tahun_lahir_ibu", "pendidikan_ibu", "pekerjaan_ibu", "penghasilan_ibu", "no_hp_ortu",
            "nama_wali", "nik_wali", "hubungan_wali", "pekerjaan_wali", "no_hp_wali",
            "status_murid", "asal_sekolah", "no_ijazah", "no_skhun", "tanggal_masuk",
            "foto_profil", "id_kelas", "nomor_absen", "status_keaktifan", "username_murid", "password_murid"
        ];
        
        const contohData = [
            "Ahmad Fauzi", "Ahmad", "23401", "0123456789", "351234567890001", "AK-9988", "Laki-laki",
            "Jember", "2015-05-12", "Islam", "WNI", "1", "2", "O",
            "Jl. Kalimantan No. 12", "68121", "Orang Tua", "Motor", "08123456789", "ahmad@skoola.id",
            "Supardi", "351234567890002", "1980", "S1", "Wiraswasta", "Rp 3.000.000 - Rp 5.000.000",
            "Siti Aminah", "351234567890003", "1984", "SMA", "Ibu Rumah Tangga", "Tidak Berpenghasilan", "08123456780",
            "", "", "", "", "",
            "Siswa Baru", "TK Pembina", "", "", "2026-07-15",
            "", "1A", "1", "Aktif", "ahmad23401", "password123"
        ];

        // Menyusun data array multidimensi SheetJS
        const dataMatrix = [headers, contohData];

        // Membuat objek Workbook dan Worksheet baru menggunakan pustaka SheetJS (XLSX)
        const worksheet = XLSX.utils.aoa_to_sheet(dataMatrix);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Murid");

        // Menuliskan dan langsung mengunduh paksa file biner .xlsx asli
        XLSX.writeFile(workbook, "template_import_murid.xlsx");
    }
    
    function handleExcelImport(event) {
        const file = event.target.files[0];
        if(!file) return;
        alert("File excel '" + file.name + "' berhasil dipilih. Siap diproses oleh sistem backend!");
    }
</script>
