<!-- TAMPILAN TABEL MURID -->
<div id="viewTabelMurid">

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
            <input type="file" id="excel_file_input" accept=".xlsx, .xls" class="hidden" onchange="handleExcelImport(event)">
            <button onclick="unduhTemplateExcelMurid()" class="bg-white text-black font-space font-bold px-4 py-3 border-4 border-black shadow-[4px_4px_0_0_#000] hover:shadow-[6px_6px_0_0_#000] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all uppercase text-xs">

            </button>
            <button onclick="document.getElementById('excel_file_input').click()" class="bg-brutal-cyan text-black font-space font-bold px-4 py-3 border-4 border-black shadow-[4px_4px_0_0_#000] hover:shadow-[6px_6px_0_0_#000] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all uppercase text-xs">
                <i class="fas fa-file-excel mr-1.5"></i> Import Excel
            </button>
            <button onclick="bukaFormMurid()" class="bg-brutal-secondary text-black font-space font-bold px-5 py-3 border-4 border-black shadow-[4px_4px_0_0_#000] hover:shadow-[6px_6px_0_0_#000] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all uppercase text-xs">
                <i class="fas fa-plus mr-1.5"></i> Tambah Murid
            </button>
        </div>
    </div>

    <div class="overflow-x-auto bg-white border-4 border-black shadow-brutal-lg p-0">
        <table class="w-full text-left border-collapse min-w-[900px] font-inter">
            <thead>
                <tr class="bg-brutal-neutral border-b-4 border-black text-xs font-space font-bold uppercase tracking-widest text-black">
                    <th class="p-4 border-r-2 border-black w-14 text-center">No</th>
                    <th class="p-4 border-r-2 border-black">NIS / NISN</th>
                    <th class="p-4 border-r-2 border-black">Nama Lengkap Murid</th>
                    <th class="p-4 border-r-2 border-black">Rombel & Absen</th>
                    <th class="p-4 border-r-2 border-black">Status</th>

            </thead>

                <tr><td colspan="6" class="p-10 text-center font-space font-bold text-lg uppercase tracking-widest bg-brutal-surface"><i class="fas fa-spinner fa-spin mr-3"></i> Memuat Data...</td></tr>

    </div>
</div>

        <!-- Data Ayah & Ibu -->
