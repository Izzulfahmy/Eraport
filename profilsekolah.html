<style>
    .profile-container { display: flex; flex-direction: column; gap: 20px; }
    .profile-header-action { display: flex; justify-content: flex-end; align-items: center; padding-bottom: 15px; border-bottom: 3px solid #000000; margin-bottom: 10px; }
    .action-header { display: flex; justify-content: flex-end; gap: 12px; }
    
    /* Tombol Ikon Neubrutalism kaku */
    .btn-icon {
        width: 44px;
        height: 44px;
        border: 3px solid #000000;
        border-radius: 0px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.1s;
    }
    .btn-edit-mode { background-color: #ffd23f; box-shadow: 3px 3px 0px #000000; color: #000; }
    .btn-edit-mode:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000000; }
    
    .btn-save-mode { background-color: #7fdde0; box-shadow: 3px 3px 0px #000000; color: #000; }
    .btn-save-mode:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000000; }
    
    .btn-cancel-mode { background-color: #ff4d4d; box-shadow: 3px 3px 0px #000000; color: #000; }
    .btn-cancel-mode:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000000; }

    .btn-icon:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000000; }

    .section-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        color: #000000;
        border-bottom: 3px solid #000000;
        padding-bottom: 6px;
        margin-bottom: 15px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 15px 20px;
    }
    
    /* Mode Baca */
    .read-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #ffffff;
        border: 2px solid #000000;
        padding: 12px;
        box-shadow: 3px 3px 0px #000000;
    }
    .read-field .label {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12px;
        font-weight: 700;
        color: #000000;
        text-transform: uppercase;
    }
    .read-field .value {
        font-size: 14px;
        color: #000000;
        font-weight: 500;
    }
    
    /* Mode Edit */
    .form-box-mode {
        background-color: #fffdf5;
        padding: 25px;
        border: 3px solid #000000;
        box-shadow: 4px 4px 0px #000000;
    }
    .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .form-field label {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        color: #000000;
    }
    .form-field input, .form-field select {
        padding: 10px 12px;
        border: 2px solid #000000;
        border-radius: 0px;
        font-size: 14px;
        color: #333;
        background-color: #fff;
        width: 100%;
    }
    .form-field input:focus, .form-field select:focus {
        border-color: #000000;
        outline: none;
        background-color: #7fdde0;
    }
    
    @media (max-width: 768px) {
        .info-grid { grid-template-columns: 1fr; }
    }
</style>

<div class="profile-container">
    <div class="profile-header-action">
        <div class="action-header">
            <button type="button" id="btnKeModeEdit" class="btn-icon btn-edit-mode" onclick="aktifkanModeEdit()" title="Edit Profil">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
            <button type="button" id="btnBatalEdit" class="btn-icon btn-cancel-mode" style="display: none;" onclick="batalkanModeEdit()" title="Batal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button type="submit" form="formProfilSekolah" id="btnSimpanProfil" class="btn-icon btn-save-mode" style="display: none;" title="Simpan Perubahan">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="wrapperModeBaca">
        <div class="section-title">1. Data Administrasi dan Legalitas</div>
        <div class="info-grid" id="gridModeBaca1"></div>

        <div class="section-title" style="margin-top: 25px;">2. Data Lokasi dan Geografis</div>
        <div class="info-grid" id="gridModeBaca2"></div>

        <div class="section-title" style="margin-top: 25px;">3. Data Kontak dan Media Resmi</div>
        <div class="info-grid" id="gridModeBaca3"></div>
    </div>

    <form id="formProfilSekolah" onsubmit="simpanProfilSekolah(event)" style="display: none;">
        <div class="form-box-mode">
            <div class="section-title">1. Data Administrasi dan Legalitas</div>
            <div class="info-grid">
                <div class="form-field"><label>Nama Resmi Sekolah</label><input type="text" id="nama_sekolah" required></div>
                <div class="form-field"><label>NPSN</label><input type="text" id="npsn" required></div>
                <div class="form-field"><label>NSS / NDS</label><input type="text" id="nss_nds"></div>
                <div class="form-field"><label>Status Sekolah</label><select id="status_sekolah"><option value="Negeri">Negeri</option><option value="Swasta">Swasta</option></select></div>
                <div class="form-field"><label>Bentuk Satuan Pendidikan</label><input type="text" id="jenjang"></div>
                <div class="form-field"><label>Status Kepemilikan</label><select id="status_kepemilikan"><option value="Pemerintah">Pemerintah</option><option value="Yayasan">Yayasan</option><option value="Pribadi">Pribadi</option></select></div>
                <div class="form-field"><label>Nama Pemilik / Yayasan</label><input type="text" id="nama_pemilik"></div>
                <div class="form-field"><label>SK Pendirian Sekolah</label><input type="text" id="sk_pendirian"></div>
                <div class="form-field"><label>SK Izin Operasional</label><input type="text" id="sk_operasional"></div>
                <div class="form-field"><label>Tanggal Berdiri / SK Operasional</label><input type="date" id="tgl_berdiri"></div>
                <div class="form-field"><label>Status Akreditasi</label><input type="text" id="status_akreditasi"></div>
                <div class="form-field"><label>Nomor Pokok Wajib Pajak (NPWP)</label><input type="text" id="npwp_sekolah"></div>
            </div>
        </div>

        <div class="form-box-mode" style="margin-top: 25px;">
            <div class="section-title">2. Data Lokasi dan Geografis</div>
            <div class="info-grid">
                <div class="form-field"><label>Alamat Lengkap</label><input type="text" id="alamat_lengkap" required></div>
                <div class="form-field"><label>Dusun / Kampung</label><input type="text" id="dusun"></div>
                <div class="form-field"><label>Desa / Kelurahan</label><input type="text" id="desa" required></div>
                <div class="form-field"><label>Kecamatan</label><input type="text" id="kecamatan" required></div>
                <div class="form-field"><label>Kabupaten / Kota</label><input type="text" id="kabupaten" required></div>
                <div class="form-field"><label>Provinsi</label><input type="text" id="provinsi" required></div>
                <div class="form-field"><label>Kode Pos</label><input type="text" id="kode_pos"></div>
                <div class="form-field"><label>Garis Lintang (Latitude)</label><input type="text" id="latitude"></div>
                <div class="form-field"><label>Garis Bujur (Longitude)</label><input type="text" id="longitude"></div>
            </div>
        </div>

        <div class="form-box-mode" style="margin-top: 25px;">
            <div class="section-title">3. Data Kontak dan Media Resmi</div>
            <div class="info-grid">
                <div class="form-field"><label>Nomor Telepon</label><input type="text" id="no_telp"></div>
                <div class="form-field"><label>Nomor Faksimile (Fax)</label><input type="text" id="fax"></div>
                <div class="form-field"><label>WhatsApp / Kontak Humas</label><input type="text" id="no_wa"></div>
                <div class="form-field"><label>Alamat Email Resmi</label><input type="email" id="email_sekolah"></div>
                <div class="form-field"><label>Situs Web Resmi (Website)</label><input type="url" id="website"></div>
                <div class="form-field"><label>Media Sosial</label><input type="text" id="medsos"></div>
            </div>
        </div>
    </form>
</div>
